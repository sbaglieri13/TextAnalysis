<!doctype html>

{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %} · Text Analysis</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="{% static 'webapp/images/favicon.svg' %}" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap">

    <!--Bootstrap CSS and Javascript -->
    <link type="text/css" rel="stylesheet" href="{% static 'webapp/bootstrap-5.1.3/css/bootstrap.min.css' %}"/>
    <script type="text/javascript" src="{% static 'webapp/bootstrap-5.1.3/js/bootstrap.bundle.min.js' %}"></script>

    <!-- My CSS file -->
    <link type="text/css" rel="stylesheet" href="{% static 'webapp/css/theme.css' %}">
    {% block styles %}{% endblock %}
</head>

<body class="{% block body_class %}{% endblock %}">

{% include "partials/navbar.html" %}

{% if error %}
<div class="ta-alert" role="alert">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
    </svg>
    <span>{{ error }}</span>
</div>
{% endif %}

{% block content %}{% endblock %}

<div class="ta-loading" id="loading" aria-hidden="true">
    <div class="ta-spinner"></div>
    <p>Analyzing…</p>
</div>

<script type="text/javascript" src="{% static 'webapp/js/ui.js' %}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
