<!doctype html>

{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Homepage</title>

    <meta name="viewport" content="width = device-width, initial-scale = 1">

    <!--Bootstrap CSS and Javascript -->
    <link type="text/css" rel="stylesheet" href="{% static 'webapp/bootstrap-5.1.3/css/bootstrap.min.css' %}"/>
    <script type="text/javascript" src="{% static 'webapp/bootstrap-5.1.3/js/bootstrap.bundle.min.js' %}"></script>

    <!-- My CSS file -->
    <link type="text/css" rel="stylesheet" href="{% static 'webapp/css/style.css' %}">

    <!-- Topics CSS file -->
    {% if scene %}
    <link type="text/css" rel="stylesheet" href="{% static scene.css %}">
    <audio src="{% static scene.audio %}" autoplay loop="true"></audio>
    {% endif %}

</head>

<body>

{% include "partials/navbar.html" with navbar_class="bg-dark" %}

<main>

    {% if error %}
    <div class="error-alert alert alert-danger text-center" role="alert">{{ error }}</div>
    {% endif %}

    <div class="form-button-text">
        <!-- Text Insert Button -->
        <button type="button" class="btn btn-warning btn-circle btn-xl" data-bs-toggle="modal"
                data-bs-target="#textModal">
            <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor"
                 class="bi bi-chat-left-text-fill" viewBox="0 0 16 16">
                <path d="M0 2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4.414a1 1 0 0 0-.707.293L.854 15.146A.5.5 0 0 1 0 14.793V2zm3.5 1a.5.5 0 0 0 0 1h9a.5.5 0 0 0 0-1h-9zm0 2.5a.5.5 0 0 0 0 1h9a.5.5 0 0 0 0-1h-9zm0 2.5a.5.5 0 0 0 0 1h5a.5.5 0 0 0 0-1h-5z"></path>
            </svg>
        </button>
    </div>
    <div class="form-button-audio">
        <!-- Audio Insert Button -->
        <button type="button" class="btn btn-warning btn-circle btn-xl" data-bs-toggle="modal"
                data-bs-target="#audioModal">
            <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-mic-fill"
                 viewBox="0 0 16 16">
                <path d="M5 3a3 3 0 0 1 6 0v5a3 3 0 0 1-6 0V3z"></path>
                <path d="M3.5 6.5A.5.5 0 0 1 4 7v1a4 4 0 0 0 8 0V7a.5.5 0 0 1 1 0v1a5 5 0 0 1-4.5 4.975V15h3a.5.5 0 0 1 0 1h-7a.5.5 0 0 1 0-1h3v-2.025A5 5 0 0 1 3 8V7a.5.5 0 0 1 .5-.5z"></path>
            </svg>
        </button>

    </div>

    <!-- Text Insert Modal-->
    <div class="modal fade" id="textModal">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">

                <form action="{% url 'analyze' %}" method="POST" enctype="multipart/form-data">

                    <!-- Modal Header -->
                    <div class="modal-header text-center">
                        <h4 class="modal-title w-100">TEXT ANALYSIS</h4>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <!-- Modal body -->
                    <div class="modal-body">
                        {% csrf_token %}
                        <label for="text-area" class="form-label">Insert text to analyze</label>
                        <textarea type="text" id="text-area" class="form-control input-lg" name="text" required></textarea>
                    </div>

                    <!-- Modal footer -->
                    <div class="modal-footer">
                        <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-success">Run</button>
                    </div>

                </form>

            </div>
        </div>
    </div>

    <!-- Audio Record Modal-->
    <div class="modal fade" id="audioModal">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">

                <form action="{% url 'analyze' %}" method="POST" enctype="multipart/form-data" data-recorder>

                    <!-- Modal Header -->
                    <div class="modal-header text-center">
                        <h4 class="modal-title w-100">SPEECH ANALYSIS</h4>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <!-- Modal body -->
                    <div class="modal-body text-center">
                        {% csrf_token %}
                        {% include "partials/audio_input.html" %}
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
                    </div>

                </form>

            </div>
        </div>
    </div>

</main>

<script type="text/javascript" src="{% static 'webapp/js/recorder.js' %}"></script>
</body>
</html>
