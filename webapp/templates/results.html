<!DOCTYPE html>

{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Results</title>

    <meta name="viewport" content="width = device-width, initial-scale = 1">

    <!-- Bootstrap CSS and Javascript -->
    <link type="text/css" rel="stylesheet" href="{% static 'webapp/bootstrap-5.1.3/css/bootstrap.min.css' %}"/>
    <script type="text/javascript" src="{% static 'webapp/bootstrap-5.1.3/js/bootstrap.bundle.min.js' %}"></script>

    <!-- My CSS file -->
    <link type="text/css" rel="stylesheet" href="{% static 'webapp/css/styleResults.css' %}">

    <!-- Chart.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.5.0/Chart.min.js"></script>

</head>
<body>

{% include "partials/navbar.html" %}

<div class="container-fluid">
    <br><br>
    <h1 style="font-family: Verdana,cursive;
    font-size: 50px;
    letter-spacing: 2px;
    word-spacing: 2px;
    color: white;
    font-weight: 700;
    text-align: center;">Result of analysis</h1>
    <br>
    <div class="row">
        <div class="col-lg-6">

            <div class="row">
                <div class="col-lg-12">
                    <label for="text-section" class="form-label"><h5 style="color: white">Text in input</h5></label>
                    <textarea id="text-section" class="form-control input-lg" name="text"
                              readonly="readonly">{{ analysis.text }}</textarea>
                </div>
            </div>

            <br>

            <div class="row">
                <div class="col-lg-9">
                    <label for="topic-section" class="form-label"><h5 style="color: white">Set of topic words</h5>
                    </label>
                    <textarea id="topic-section" class="form-control input-lg" name="text"
                              readonly="readonly">{{ analysis.topic|default:"Topic not found" }}</textarea>
                </div>

                <div class="col-lg-3">
                    <label for="topic-acc-section" class="form-label"><h5 style="color: white">Topic probability</h5>
                    </label>
                    <textarea id="topic-acc-section" class="form-control input-lg" name="text" readonly="readonly">{% if analysis.topic %}{% widthratio analysis.topic_probability 1 100 %} %{% endif %}</textarea>
                </div>
            </div>

            <br><br>
            <div class="row">
                <div class="position-relative">
                    <div class="col text-center">
                        <button type="button" class="btn btn-outline-light btn-lg" data-bs-toggle="modal"
                                data-bs-target="#sentModal" style="margin-bottom:20px">View sentiment for every sentence
                            of the text
                        </button>
                    </div>
                </div>

                <div class="modal fade" id="sentModal">
                    <div class="modal-dialog modal-xl">
                        <div class="modal-content">

                            <!-- Modal Header -->
                            <div class="modal-header text-center">
                                <h4 class="modal-title w-100">SENTIMENT FOR SENTENCE</h4>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>

                            <!-- Modal body -->
                            <div class="modal-body">
                                {% for sent in analysis.sentences %}
                                <br>
                                <div class="row">
                                    <div class="col-lg-6">
                                        <label class="form-label"><h5>Sentence</h5></label>
                                        <textarea class="form-control input-lg" name="text" readonly="readonly">{{ sent.sentence }}</textarea>
                                    </div>

                                    <div class="col-lg-3">
                                        <label class="form-label"><h5>Sentiment</h5></label>
                                        <textarea class="form-control input-lg" name="text" readonly="readonly">{{ sent.label }}</textarea>
                                    </div>

                                    <div class="col-lg-3">
                                        <label class="form-label"><h5>Score</h5></label>
                                        <textarea class="form-control input-lg" name="text" readonly="readonly">{{ sent.score|floatformat:3 }}</textarea>
                                    </div>
                                </div>
                                <hr>
                                {% endfor %}
                            </div>

                            <!-- Modal footer -->
                            <div class="modal-footer">
                                <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
                            </div>

                        </div>
                    </div>
                </div>

            </div>
        </div>

        <div class="col-lg-6">
            <h5 style="color: white; text-align: center">Sentiment</h5>
            <canvas id="pie-chart" width="550" height="300"></canvas>
            {{ analysis.sentiment_distribution|json_script:"sentiment-distribution" }}

            <script>
                const distribution = JSON.parse(document.getElementById("sentiment-distribution").textContent);
                new Chart(document.getElementById("pie-chart"), {
                    type: 'pie',
                    data: {
                        labels: ["Positive", "Neutral", "Negative"],
                        datasets: [{
                            backgroundColor: ["#46BFBD", "#FDB45C", "#F7464A"],
                            data: [distribution.POSITIVE, distribution.NEUTRAL, distribution.NEGATIVE]
                        }]
                    },
                    options: {
                        legend: {
                            labels: {
                                fontColor: "white",
                                fontSize: 18
                            }
                        },
                    }
                });
            </script>
        </div>
    </div>

    <br><br><br>
    <div class="row">
        <div class="position-relative">
            <div class="position-absolute top-0 start-50 translate-middle-x">
                <a class="btn btn-warning btn-lg align-self-center" href="{% url 'advanced-analysis' %}" role="button">New
                    Analysis</a>
            </div>
        </div>
    </div>

</div>
</body>
</html>
