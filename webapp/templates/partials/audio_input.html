<div class="ta-recorder">
    <button type="button" class="ta-record-button" data-record-button aria-label="Record">
        <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M5 3a3 3 0 0 1 6 0v5a3 3 0 0 1-6 0V3z"></path>
            <path d="M3.5 6.5A.5.5 0 0 1 4 7v1a4 4 0 0 0 8 0V7a.5.5 0 0 1 1 0v1a5 5 0 0 1-4.5 4.975V15h3a.5.5 0 0 1 0 1h-7a.5.5 0 0 1 0-1h3v-2.025A5 5 0 0 1 3 8V7a.5.5 0 0 1 .5-.5z"></path>
        </svg>
    </button>
    <p class="ta-record-label" data-record-label>Record</p>
    <p class="ta-record-timer" data-record-timer>00:00</p>
    <p class="ta-hint">Click on the button to record the audio and wait the end of the analysis</p>
    <p class="ta-record-status" data-record-status></p>
    <input type="file" name="audio" accept=".wav,audio/wav" hidden>
</div>
