[project]
name = "text-analysis"
version = "2.0.0"
description = "Sentence-level sentiment analysis and topic recognition for text and speech, with a Django web app and REST API."
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["webapp/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore:No directory at:UserWarning",
    "ignore:'(aifc|audioop)' is deprecated:DeprecationWarning",
]
